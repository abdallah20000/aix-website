<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>AIX التركيبات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#000; --paper:#fff; --line:#e3e3e3; --soft:#f5f5f5; --muted:#6f6f6f;
  --lime:#8dc63f; --lime-dark:#5e8f1f; --red:#c62828; --amber:#b26a00;
  --font:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.hidden{display:none!important}
.brand{font-weight:700;font-size:44px;letter-spacing:1px;color:var(--lime);line-height:1;direction:ltr;text-align:right}

#gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--ink);color:#aaa;text-align:center}
#gate a{color:var(--lime)}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
header .brand{font-size:24px}
header .who{font-size:13px;color:#bbb;display:flex;gap:12px;align-items:center}
header .who a{color:#fff;font-size:13px}
.ghost{background:transparent;border:1px solid #444;color:#fff;border-radius:6px;padding:6px 12px;font-size:13px}
main{max-width:1180px;margin:0 auto;padding:20px}

.pipe{display:flex;border:1px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:18px}
.pipe button{flex:1;min-width:0;border:0;border-inline-start:1px solid var(--line);background:var(--paper);padding:12px 8px;text-align:right}
.pipe button:first-child{border-inline-start:0}
.pipe b{display:block;font-size:26px;line-height:1.1}
.pipe span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pipe button.on{background:var(--ink);color:#fff}
.pipe button.on span{color:#ccc}

.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools input,.tools select{padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff}
.tools input{flex:1;min-width:200px}
.primary{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:10px 18px;font-weight:600}
.primary:hover{background:#222}
.primary:disabled{opacity:.5}
.line-btn{background:#fff;border:1px solid var(--ink);border-radius:6px;padding:9px 14px;font-weight:600}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:760px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:#fafafa}
.name{font-weight:600}
.sub{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
.st-pending{border-color:var(--ink)}
.st-in_progress{background:var(--ink);color:#fff;border-color:var(--ink)}
.st-done{background:var(--lime);border-color:var(--lime);color:#000;font-weight:600}
.st-cancelled{color:var(--muted);text-decoration:line-through}
.late-date{color:var(--red);font-weight:600}
.today-date{color:var(--lime-dark);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--muted)}
.icon-link{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--ink);font-size:14px}

.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(560px,100%);background:#fff;z-index:11;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-head h2{margin:0;font-size:18px}
.x{border:0;background:none;font-size:24px;line-height:1}
.drawer-body{overflow-y:auto;padding:20px;flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:#fff}
.f textarea{min-height:60px;resize:vertical}
.actions{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
.danger{background:none;border:0;color:var(--red);font-size:13px;margin-inline-start:auto}
.section-t{font-size:15px;font-weight:700;margin:28px 0 10px;padding-top:18px;border-top:1px solid var(--line)}

.parts{list-style:none;margin:12px 0 0;padding:0}
.parts li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.parts .undo{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:12px}
.take{display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:end}

.ph-head{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}
.ph-head b{font-size:14px}
.upl{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);border-radius:6px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.upl input{display:none}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos figure{margin:0;position:relative;aspect-ratio:1;background:var(--soft);border-radius:6px;overflow:hidden}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos button{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:1}
.photos .none{grid-column:1/-1;font-size:13px;color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;z-index:20;font-size:14px}

@media (max-width:720px){
  main{padding:14px}
  .pipe{overflow-x:auto}
  .pipe button{min-width:86px}
  .grid{grid-template-columns:1fr}
  header .who .email{display:none}
  .take{grid-template-columns:1fr 80px}
  .take .primary{grid-column:1/-1}
  /* rows become cards on phones */
  .tbl-wrap{border:0;overflow:visible}
  table{min-width:0}
  thead{display:none}
  tbody,tr,td{display:block}
  tr.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px}
  tr.row td{padding:0;border:0}
  tr.row td:nth-child(1){grid-column:1;grid-row:1}
  tr.row td:nth-child(2){grid-column:1;grid-row:2;font-size:13px;color:var(--muted)}
  tr.row td:nth-child(3){grid-column:1;grid-row:3;font-size:13px}
  tr.row td:nth-child(4){grid-column:2;grid-row:1}
  tr.row td:nth-child(5){grid-column:2;grid-row:2 / span 2;align-self:end;text-align:left;font-size:13px}
  tr.row td:nth-child(6){grid-column:1 / -1;grid-row:4;margin-top:8px}
  td.empty{border:1px solid var(--line);border-radius:8px}
}
</style>
</head>
<body>

<section id="gate">
  <div>
    <div class="brand" style="text-align:center">AIX</div>
    <p id="gateMsg">بيحمّل…</p>
  </div>
</section>

<div id="app" class="hidden">
  <header>
    <div class="brand">AIX <span style="font-size:14px;color:#fff;font-weight:500">التركيبات</span></div>
    <div class="who">
      <a href="/crm.html" class="admin-only hidden">العملاء</a>
      <a href="/inventory.html" class="admin-only hidden">المخزن</a>
      <span class="email" id="userEmail" dir="ltr"></span><button class="ghost" id="logout">خروج</button>
    </div>
  </header>
  <main>
    <div class="pipe" id="pipe"></div>
    <div class="tools">
      <input id="q" type="search" placeholder="دوّر باسم العميل، الموبايل أو المنطقة">
      <select id="fTech"><option value="">كل الفنيين</option></select>
      <button class="primary" id="newInst">+ تركيبة جديدة</button>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>العميل</th><th>المنطقة</th><th>الفني</th><th>الحالة</th><th>المعاد</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
</div>

<div class="shade hidden" id="shade"></div>
<aside class="drawer hidden" id="drawer" aria-modal="true" role="dialog">
  <div class="drawer-head"><h2 id="dTitle">تركيبة جديدة</h2><button class="x" id="dClose" aria-label="إغلاق">×</button></div>
  <div class="drawer-body">
    <form id="instForm">
      <div class="grid">
        <div class="f"><label>اسم العميل *</label><input name="customer_name" required></div>
        <div class="f"><label>الموبايل</label><input name="phone" dir="ltr" inputmode="tel"></div>
        <div class="f"><label>المنطقة / الكمبوند</label><input name="area" list="areas"></div>
        <div class="f"><label>الفني</label><input name="technician" list="team"></div>
        <div class="f full"><label>العنوان بالتفصيل</label><input name="address"></div>
        <div class="f"><label>اليوم</label><input name="scheduled_date" type="date"></div>
        <div class="f"><label>الساعة</label><input name="scheduled_time" type="time"></div>
        <div class="f"><label>الحالة</label><select name="status" id="statusSel"></select></div>
        <div class="f full"><label>ملاحظات</label><textarea name="notes"></textarea></div>
      </div>
      <div class="actions">
        <button class="primary" type="submit" id="saveBtn">حفظ</button>
        <button type="button" class="danger hidden" id="delBtn">مسح التركيبة</button>
      </div>
    </form>

    <div id="more" class="hidden">
      <div class="section-t">الحاجات اللي خرجت من المخزن</div>
      <form class="take" id="takeForm">
        <div class="f"><label>الصنف</label><select name="item" id="itemSel" required></select></div>
        <div class="f"><label>العدد</label><input name="qty" type="number" min="0.01" step="any" inputmode="decimal" required dir="ltr"></div>
        <button class="primary" type="submit" id="takeBtn">اخصم من المخزن</button>
      </form>
      <ul class="parts" id="parts"></ul>

      <div class="section-t">الصور</div>
      <div class="ph-head"><b>قبل</b><label class="upl">+ صور<input type="file" accept="image/*" multiple data-kind="before"></label></div>
      <div class="photos" id="ph-before"></div>
      <div class="ph-head"><b>بعد</b><label class="upl">+ صور<input type="file" accept="image/*" multiple data-kind="after"></label></div>
      <div class="photos" id="ph-after"></div>
    </div>
  </div>
</aside>

<datalist id="areas">
  <option>الشيخ زايد</option><option>6 أكتوبر</option><option>التجمع الخامس</option><option>القاهرة الجديدة</option>
  <option>العاصمة الإدارية</option><option>نيو زايد</option><option>حدائق أكتوبر</option><option>مدينة بدر</option>
</datalist>
<datalist id="team"><option>عبدالله</option><option>أيمن</option><option>هاجر</option><option>حور</option></datalist>

<div class="toast hidden" id="toast"></div>

<script>
const SUPABASE_URL = "https://xenrnhgxwhujyvtpwmsk.supabase.co";
const SUPABASE_KEY = "sb_publishable_PWiz7ybQJDngH5Ox3vkx6g_GuCQnQ1R";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = "install-photos";

const STATUSES = [["pending","مستني"],["in_progress","شغالين فيها"],["done","خلصت ✓"],["cancelled","اتلغت"]];
const sLabel = v => (STATUSES.find(s=>s[0]===v)||[,v||"—"])[1];

let insts = [], stock = [], user = null, current = null, statusFilter = "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr = () => new Date().toLocaleDateString("en-CA");
const fmtN = n => Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2});
const fmtDate = d => d ? new Date(d+"T00:00:00").toLocaleDateString("ar-EG",{weekday:"short",day:"numeric",month:"short"}) : "—";
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add("hidden"),2600)}
function waLink(p){let n=String(p||"").replace(/\D/g,"");if(n.startsWith("0"))n="2"+n;return "https://wa.me/"+n}

$("statusSel").innerHTML = STATUSES.map(([v,l])=>`<option value="${v}">${l}</option>`).join("");

// ---------- AUTH ----------
$("logout").onclick = async ()=>{ await sb.auth.signOut(); location.replace("/crm.html"); };
// supabase-js can deadlock if the auth callback awaits other supabase calls, so defer
sb.auth.onAuthStateChange((_ev, session)=>{ setTimeout(()=>onSession(session), 0); });
async function onSession(session){
  user = session?.user || null;
  if(!user){ location.replace("/crm.html"); return; }
  const { data: role } = await sb.rpc("my_role");
  if(role !== "admin" && role !== "installs"){
    $("gateMsg").innerHTML = 'الحساب ده مش مسموح له يدخل التركيبات. <a href="/crm.html">ارجع</a>';
    return;
  }
  document.querySelectorAll(".admin-only").forEach(a=>a.classList.toggle("hidden", role !== "admin"));
  $("userEmail").textContent = user.email;
  $("gate").classList.add("hidden"); $("app").classList.remove("hidden");
  loadInsts(); loadStock();
}

// ---------- DATA ----------
async function loadInsts(){
  const { data, error } = await sb.from("installations").select("*")
    .order("scheduled_date",{ascending:true,nullsFirst:false}).order("created_at",{ascending:false});
  if(error){ toast("مشكلة في تحميل التركيبات"); console.error(error); return; }
  insts = data;
  const techs = [...new Set(insts.map(i=>i.technician).filter(Boolean))].sort();
  const sel=$("fTech"), keep=sel.value;
  sel.innerHTML = `<option value="">كل الفنيين</option>` + techs.map(t=>`<option>${esc(t)}</option>`).join("");
  sel.value = techs.includes(keep) ? keep : "";
  render();
}
async function loadStock(){
  const { data, error } = await sb.from("inventory_items").select("id,name,unit,quantity").order("name");
  if(error){ console.error(error); return; }
  stock = data;
  $("itemSel").innerHTML = `<option value="">اختار صنف…</option>` + stock.map(s=>
    `<option value="${s.id}" ${Number(s.quantity)<=0?"disabled":""}>${esc(s.name)} — موجود ${fmtN(s.quantity)} ${esc(s.unit)}</option>`).join("");
}

function render(){
  const t = todayStr();
  const counts = Object.fromEntries(STATUSES.map(([v])=>[v,0]));
  insts.forEach(i=>{ if(counts[i.status]!==undefined) counts[i.status]++; });
  const todayCount = insts.filter(i=>i.scheduled_date===t && i.status!=="cancelled").length;
  $("pipe").innerHTML =
    `<button class="${statusFilter===""?"on":""}" data-s=""><b>${insts.length}</b><span>الكل</span></button>` +
    `<button class="${statusFilter==="today"?"on":""}" data-s="today"><b>${todayCount}</b><span>النهارده</span></button>` +
    STATUSES.map(([v,l])=>`<button class="${statusFilter===v?"on":""}" data-s="${v}"><b>${counts[v]}</b><span>${l}</span></button>`).join("");
  $("pipe").querySelectorAll("button").forEach(b=>b.onclick=()=>{statusFilter=b.dataset.s;render()});

  const q=$("q").value.trim().toLowerCase(), ft=$("fTech").value;
  const list = insts.filter(i=>
    (!statusFilter || (statusFilter==="today" ? i.scheduled_date===t && i.status!=="cancelled" : i.status===statusFilter)) &&
    (!ft || i.technician===ft) &&
    (!q || [i.customer_name,i.phone,i.area,i.address].some(x=>String(x||"").toLowerCase().includes(q))));
  if(!list.length){ $("rows").innerHTML = `<tr><td colspan="6" class="empty">${insts.length?"مفيش نتايج":"لسه مفيش تركيبات — اضغط «تركيبة جديدة» وابدأ"}</td></tr>`; return; }
  $("rows").innerHTML = list.map(i=>{
    const d=i.scheduled_date, open=!["done","cancelled"].includes(i.status);
    const cls = !d||!open ? "" : d<t ? "late-date" : d===t ? "today-date" : "";
    return `<tr class="row" data-id="${i.id}">
      <td><div class="name">${esc(i.customer_name)}</div>${i.phone?`<div class="sub" dir="ltr" style="text-align:right">${esc(i.phone)}</div>`:""}</td>
      <td>${esc(i.area||"—")}</td>
      <td>${i.technician?"👷 "+esc(i.technician):"—"}</td>
      <td><span class="tag st-${esc(i.status)}">${esc(sLabel(i.status))}</span></td>
      <td class="${cls}">${fmtDate(d)}${i.scheduled_time?` · <span dir="ltr">${esc(i.scheduled_time)}</span>`:""}</td>
      <td style="white-space:nowrap">${i.phone?`<a class="icon-link" href="tel:${esc(i.phone)}" title="اتصال" onclick="event.stopPropagation()">☎</a>
          <a class="icon-link" href="${waLink(i.phone)}" target="_blank" rel="noopener" title="واتساب" onclick="event.stopPropagation()">✆</a>`:""}</td>
    </tr>`;}).join("");
  $("rows").querySelectorAll("tr.row").forEach(r=>r.onclick=()=>openInst(r.dataset.id));
}
["q","fTech"].forEach(id=>$(id).addEventListener("input",render));

// ---------- DRAWER ----------
function showDrawer(on){ $("drawer").classList.toggle("hidden",!on); $("shade").classList.toggle("hidden",!on); }
$("dClose").onclick = $("shade").onclick = ()=>showDrawer(false);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") showDrawer(false); });

const FIELDS = ["customer_name","phone","area","address","technician","scheduled_date","scheduled_time","status","notes"];

$("newInst").onclick = ()=>{
  current=null; const f=$("instForm"); f.reset(); f.status.value="pending";
  $("dTitle").textContent="تركيبة جديدة"; $("delBtn").classList.add("hidden"); $("more").classList.add("hidden");
  showDrawer(true); f.customer_name.focus();
};

function openInst(id){
  current = insts.find(i=>i.id===id); if(!current) return;
  const f=$("instForm"); FIELDS.forEach(k=>f[k].value = current[k] ?? "");
  $("dTitle").textContent=current.customer_name; $("delBtn").classList.remove("hidden"); $("more").classList.remove("hidden");
  $("takeForm").reset(); showDrawer(true); loadParts(); loadPhotos();
}

$("instForm").addEventListener("submit", async e=>{
  e.preventDefault(); const f=e.target;
  const row = Object.fromEntries(FIELDS.map(k=>[k, f[k].value.trim() || null]));
  row.status = row.status || "pending"; row.updated_at = new Date().toISOString();
  if(!current) row.created_by = user.email;
  $("saveBtn").disabled=true;
  const res = current ? await sb.from("installations").update(row).eq("id",current.id).select().single()
                      : await sb.from("installations").insert(row).select().single();
  $("saveBtn").disabled=false;
  if(res.error){ toast("الحفظ فشل"); console.error(res.error); return; }
  toast(current?"اتعدل ✓":"التركيبة اتضافت ✓");
  await loadInsts(); openInst(res.data.id);
});

$("delBtn").onclick = async ()=>{
  if(!current || !confirm(`مسح تركيبة ${current.customer_name}؟\nأي حاجات اتخصمت من المخزن هترجع له، والصور هتتمسح.`)) return;
  const id = current.id;
  const { data: lines } = await sb.from("installation_items").select("id").eq("installation_id",id);
  for(const l of lines||[]){
    const { error } = await sb.rpc("install_return_item",{ p_line:l.id });
    if(error){ toast("مقدرتش أرجّع الحاجات للمخزن"); console.error(error); return; }
  }
  const { data: pics } = await sb.from("installation_photos").select("path").eq("installation_id",id);
  if(pics?.length) await sb.storage.from(BUCKET).remove(pics.map(p=>p.path));
  const { error } = await sb.from("installations").delete().eq("id",id);
  if(error){ toast("المسح فشل"); return; }
  showDrawer(false); toast("اتمسحت"); loadInsts(); loadStock();
};

// ---------- PARTS ----------
async function loadParts(){
  $("parts").innerHTML = `<li class="sub">بيحمّل…</li>`;
  const { data, error } = await sb.from("installation_items").select("id,qty,created_at,item_id").eq("installation_id",current.id).order("created_at");
  if(error){ $("parts").innerHTML=""; toast("مشكلة في تحميل الحاجات"); return; }
  const byId = Object.fromEntries(stock.map(s=>[s.id,s]));
  $("parts").innerHTML = data.length ? data.map(l=>{
    const s = byId[l.item_id] || {name:"صنف", unit:""};
    return `<li><span><b>${fmtN(l.qty)}</b> ${esc(s.unit)} · ${esc(s.name)}</span><button class="undo" data-id="${l.id}">رجّعه للمخزن</button></li>`;
  }).join("") : `<li class="sub">لسه ماخرجش حاجة من المخزن للتركيبة دي</li>`;
  $("parts").querySelectorAll(".undo").forEach(b=>b.onclick=async()=>{
    if(!confirm("ترجّع ده للمخزن؟")) return;
    const { error } = await sb.rpc("install_return_item",{ p_line:b.dataset.id });
    if(error){ toast("مقدرتش أرجّعه"); console.error(error); return; }
    toast("رجع للمخزن ✓"); await loadStock(); loadParts();
  });
}

$("takeForm").addEventListener("submit", async e=>{
  e.preventDefault(); if(!current) return; const f=e.target;
  $("takeBtn").disabled=true;
  const { error } = await sb.rpc("install_take_item",{ p_installation:current.id, p_item:f.item.value, p_qty:Number(f.qty.value) });
  $("takeBtn").disabled=false;
  if(error){ toast(/not enough/.test(error.message) ? "المخزن مفيهوش العدد ده" : "الخصم فشل"); console.error(error); return; }
  toast("اتخصم من المخزن ✓"); f.reset(); await loadStock(); loadParts();
});

// ---------- PHOTOS ----------
async function loadPhotos(){
  const inst = current.id;
  ["before","after"].forEach(k=>$("ph-"+k).innerHTML=`<div class="none">بيحمّل…</div>`);
  const { data, error } = await sb.from("installation_photos").select("*").eq("installation_id",inst).order("created_at");
  if(error || current?.id !== inst){ return; }
  let urls = {};
  if(data.length){
    const { data: signed } = await sb.storage.from(BUCKET).createSignedUrls(data.map(p=>p.path), 3600);
    (signed||[]).forEach(s=>{ if(s.signedUrl) urls[s.path]=s.signedUrl; });
  }
  ["before","after"].forEach(k=>{
    const list = data.filter(p=>p.kind===k);
    $("ph-"+k).innerHTML = list.length ? list.map(p=>
      `<figure><a href="${esc(urls[p.path]||"#")}" target="_blank" rel="noopener"><img src="${esc(urls[p.path]||"")}" alt="" loading="lazy"></a>
       <button data-id="${p.id}" data-path="${esc(p.path)}" aria-label="مسح الصورة">×</button></figure>`).join("")
      : `<div class="none">مفيش صور</div>`;
  });
  document.querySelectorAll(".photos button").forEach(b=>b.onclick=async()=>{
    if(!confirm("تمسح الصورة دي؟")) return;
    await sb.storage.from(BUCKET).remove([b.dataset.path]);
    await sb.from("installation_photos").delete().eq("id",b.dataset.id);
    loadPhotos();
  });
}

document.querySelectorAll(".upl input").forEach(inp=>inp.addEventListener("change", async ()=>{
  if(!current || !inp.files.length) return;
  const kind = inp.dataset.kind, files=[...inp.files]; inp.value="";
  toast(`بيرفع ${files.length} صورة…`);
  let ok=0;
  for(const file of files){
    const ext = (file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg";
    const path = `${current.id}/${kind}-${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const up = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || "image/jpeg" });
    if(up.error){ console.error(up.error); continue; }
    const { error } = await sb.from("installation_photos").insert({ installation_id:current.id, kind, path, uploaded_by:user.email });
    if(error){ console.error(error); await sb.storage.from(BUCKET).remove([path]); continue; }
    ok++;
  }
  toast(ok===files.length ? "الصور اترفعت ✓" : `اترفع ${ok} من ${files.length} — الباقي فشل`);
  loadPhotos();
}));
</script>
