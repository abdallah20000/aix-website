<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>AIX المخزن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#000; --paper:#fff; --line:#e3e3e3; --soft:#f5f5f5; --muted:#6f6f6f;
  --lime:#8dc63f; --lime-dark:#5e8f1f; --red:#c62828; --amber:#b26a00;
  --font:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.hidden{display:none!important}
.brand{font-weight:700;font-size:44px;letter-spacing:1px;color:var(--lime);line-height:1;direction:ltr;text-align:right}

#gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--ink);color:#aaa;text-align:center}
#gate a{color:var(--lime)}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
header .brand{font-size:24px}
header .who{font-size:13px;color:#bbb;display:flex;gap:12px;align-items:center}
header .who a{color:#fff;font-size:13px}
.ghost{background:transparent;border:1px solid #444;color:#fff;border-radius:6px;padding:6px 12px;font-size:13px}
main{max-width:1180px;margin:0 auto;padding:20px}

.stats{display:flex;border:1px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:18px}
.stats button{flex:1;min-width:0;border:0;border-inline-start:1px solid var(--line);background:var(--paper);padding:12px 8px;text-align:right}
.stats button:first-child{border-inline-start:0}
.stats b{display:block;font-size:26px;line-height:1.1}
.stats span{font-size:12px;color:var(--muted);display:block}
.stats button.on{background:var(--ink);color:#fff}
.stats button.on span{color:#ccc}

.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools input,.tools select{padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff}
.tools input{flex:1;min-width:200px}
.primary{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:10px 18px;font-weight:600}
.primary:hover{background:#222}
.primary:disabled{opacity:.5}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:#fafafa}
.name{font-weight:600}
.sub{font-size:12px;color:var(--muted)}
.qty{font-weight:700;font-size:17px}
.low{color:var(--red)}
.zero{color:var(--muted);text-decoration:line-through}
.tag-low{font-size:11px;border:1px solid var(--red);color:var(--red);padding:1px 8px;border-radius:20px;margin-inline-start:6px;font-weight:600}
.empty{padding:40px;text-align:center;color:var(--muted)}

.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(520px,100%);background:#fff;z-index:11;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-head h2{margin:0;font-size:18px}
.x{border:0;background:none;font-size:24px;line-height:1}
.drawer-body{overflow-y:auto;padding:20px;flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:#fff}
.f textarea{min-height:60px;resize:vertical}
.actions{display:flex;gap:10px;margin-top:16px;align-items:center}
.danger{background:none;border:0;color:var(--red);font-size:13px;margin-inline-start:auto}
.section-t{font-size:15px;font-weight:700;margin:28px 0 10px;padding-top:18px;border-top:1px solid var(--line)}
.now{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
.now b{font-size:34px;line-height:1}
.kinds{display:flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden;margin-bottom:12px}
.kinds button{flex:1;border:0;border-inline-start:1px solid var(--line);background:#fff;padding:9px 6px;font-weight:600}
.kinds button:first-child{border-inline-start:0}
.kinds button[aria-pressed="true"]{background:var(--ink);color:#fff}
.timeline{list-style:none;margin:16px 0 0;padding:0}
.timeline li{padding:10px 0;border-top:1px solid var(--line)}
.timeline .meta{font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;z-index:20;font-size:14px}

@media (max-width:720px){
  main{padding:14px}
  .grid{grid-template-columns:1fr}
  header .who .email{display:none}
  /* rows become cards on phones */
  .tbl-wrap{border:0;overflow:visible}
  table{min-width:0}
  thead{display:none}
  tbody,tr,td{display:block}
  tr.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px}
  tr.row td{padding:0;border:0}
  tr.row td:nth-child(1){grid-column:1;grid-row:1}
  tr.row td:nth-child(4){grid-column:2;grid-row:1 / span 2;align-self:center;text-align:left}
  tr.row td:nth-child(2),tr.row td:nth-child(3){display:inline;font-size:12px;color:var(--muted)}
  tr.row td:nth-child(2){grid-column:1;grid-row:2}
  tr.row td:nth-child(3){grid-column:1;grid-row:3}
  tr.row td:nth-child(5){display:none}
  .qty{font-size:22px}
  td.empty{border:1px solid var(--line);border-radius:8px}
}
</style>
</head>
<body>

<section id="gate">
  <div>
    <div class="brand" style="text-align:center">AIX</div>
    <p id="gateMsg">بيحمّل…</p>
  </div>
</section>

<div id="app" class="hidden">
  <header>
    <div class="brand">AIX <span style="font-size:14px;color:#fff;font-weight:500">المخزن</span></div>
    <div class="who"><a href="/crm.html" class="admin-only hidden">العملاء</a><a href="/installs.html" class="admin-only hidden">التركيبات</a><span class="email" id="userEmail" dir="ltr"></span><button class="ghost" id="logout">خروج</button></div>
  </header>
  <main>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <input id="q" type="search" placeholder="دوّر باسم الصنف أو المكان">
      <select id="fCat"><option value="">كل الأنواع</option></select>
      <button class="primary" id="newItem">+ صنف جديد</button>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>الصنف</th><th>النوع</th><th>المكان</th><th>الكمية</th><th>آخر تعديل</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
</div>

<div class="shade hidden" id="shade"></div>
<aside class="drawer hidden" id="drawer" aria-modal="true" role="dialog">
  <div class="drawer-head"><h2 id="dTitle">صنف جديد</h2><button class="x" id="dClose" aria-label="إغلاق">×</button></div>
  <div class="drawer-body">

    <div id="moveBlock" class="hidden">
      <div class="now"><b id="nowQty">0</b><span id="nowUnit"></span></div>
      <div class="kinds" id="kinds">
        <button type="button" data-k="count" aria-pressed="true">جرد</button>
        <button type="button" data-k="in" aria-pressed="false">وارد +</button>
        <button type="button" data-k="out" aria-pressed="false">صادر −</button>
      </div>
      <form id="moveForm">
        <div class="grid">
          <div class="f"><label id="amtLabel">العدد الفعلي على الرف</label><input name="amount" type="number" min="0" step="any" inputmode="decimal" required dir="ltr"></div>
          <div class="f"><label>ملاحظة</label><input name="note" placeholder="مثلاً: لمشروع فيلا زايد"></div>
        </div>
        <div class="actions"><button class="primary" type="submit" id="moveBtn">سجّل</button></div>
      </form>
      <div class="section-t">بيانات الصنف</div>
    </div>

    <form id="itemForm">
      <div class="grid">
        <div class="f full"><label>اسم الصنف *</label><input name="name" required></div>
        <div class="f"><label>النوع</label><input name="category" list="cats"></div>
        <div class="f"><label>الوحدة</label><input name="unit" list="units" value="قطعة"></div>
        <div class="f" id="startQtyF"><label>الكمية الحالية</label><input name="quantity" type="number" min="0" step="any" inputmode="decimal" dir="ltr" value="0"></div>
        <div class="f"><label>حد التنبيه (لو قل عن كده)</label><input name="min_qty" type="number" min="0" step="any" inputmode="decimal" dir="ltr"></div>
        <div class="f"><label>المكان</label><input name="location" placeholder="مثلاً: رف 3"></div>
        <div class="f full"><label>ملاحظات</label><textarea name="notes"></textarea></div>
      </div>
      <div class="actions">
        <button class="primary" type="submit" id="saveBtn">حفظ</button>
        <button type="button" class="danger hidden" id="delBtn">مسح الصنف</button>
      </div>
    </form>

    <div id="histBlock" class="hidden">
      <div class="section-t">سجل الحركة</div>
      <ul class="timeline" id="timeline"></ul>
    </div>
  </div>
</aside>

<datalist id="cats">
  <option>سويتشات</option><option>ستاير</option><option>كاميرات</option><option>أقفال</option>
  <option>حساسات</option><option>تكييف</option><option>شبكات</option><option>كابلات</option><option>إكسسوارات</option>
</datalist>
<datalist id="units"><option>قطعة</option><option>متر</option><option>لفة</option><option>علبة</option><option>كرتونة</option></datalist>

<div class="toast hidden" id="toast"></div>

<script>
const SUPABASE_URL = "https://xenrnhgxwhujyvtpwmsk.supabase.co";
const SUPABASE_KEY = "sb_publishable_PWiz7ybQJDngH5Ox3vkx6g_GuCQnQ1R";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const KINDS = {count:"جرد", in:"وارد", out:"صادر"};
let items = [], user = null, current = null, kind = "count", lowOnly = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtN = n => Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2});
const fmtWhen = d => d ? new Date(d).toLocaleString("ar-EG",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}) : "—";
const isLow = i => i.min_qty != null && Number(i.quantity) <= Number(i.min_qty);
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add("hidden"),2600)}

// ---------- AUTH ----------
$("logout").onclick = async ()=>{ await sb.auth.signOut(); location.replace("/crm.html"); };
// supabase-js can deadlock if the auth callback awaits other supabase calls, so defer
sb.auth.onAuthStateChange((_ev, session)=>{ setTimeout(()=>onSession(session), 0); });
async function onSession(session){
  user = session?.user || null;
  if(!user){ location.replace("/crm.html"); return; }
  const { data: role } = await sb.rpc("my_role");
  if(role !== "admin" && role !== "inventory"){
    $("gateMsg").innerHTML = 'الحساب ده مش مسموح له يدخل المخزن. <a href="/crm.html">ارجع</a>';
    return;
  }
  document.querySelectorAll(".admin-only").forEach(a=>a.classList.toggle("hidden", role !== "admin"));
  $("userEmail").textContent = user.email;
  $("gate").classList.add("hidden"); $("app").classList.remove("hidden");
  loadItems();
}

// ---------- DATA ----------
async function loadItems(){
  const { data, error } = await sb.from("inventory_items").select("*").order("name");
  if(error){ toast("مشكلة في تحميل المخزن"); console.error(error); return; }
  items = data;
  const cats = [...new Set(items.map(i=>i.category).filter(Boolean))].sort();
  const sel = $("fCat"), keep = sel.value;
  sel.innerHTML = `<option value="">كل الأنواع</option>` + cats.map(c=>`<option>${esc(c)}</option>`).join("");
  sel.value = cats.includes(keep) ? keep : "";
  render();
}

function render(){
  const low = items.filter(isLow).length;
  $("stats").innerHTML =
    `<button class="${!lowOnly?"on":""}" data-l="0"><b>${items.length}</b><span>كل الأصناف</span></button>` +
    `<button class="${lowOnly?"on":""}" data-l="1"><b${low?' class="low"':""}>${low}</b><span>قربت تخلص</span></button>`;
  $("stats").querySelectorAll("button").forEach(b=>b.onclick=()=>{lowOnly=b.dataset.l==="1";render()});

  const q=$("q").value.trim().toLowerCase(), fc=$("fCat").value;
  const list = items.filter(i=>(!lowOnly||isLow(i)) && (!fc||i.category===fc) &&
    (!q || [i.name,i.location,i.category].some(x=>String(x||"").toLowerCase().includes(q))));
  if(!list.length){ $("rows").innerHTML = `<tr><td colspan="5" class="empty">${items.length?"مفيش نتايج":"لسه مفيش أصناف — اضغط «صنف جديد» وابدأ الجرد"}</td></tr>`; return; }
  $("rows").innerHTML = list.map(i=>{
    const cls = Number(i.quantity)<=0 ? "zero" : isLow(i) ? "low" : "";
    return `<tr class="row" data-id="${i.id}">
      <td><div class="name">${esc(i.name)}${isLow(i)?'<span class="tag-low">قربت تخلص</span>':""}</div>${i.notes?`<div class="sub">${esc(i.notes)}</div>`:""}</td>
      <td>${esc(i.category||"—")}</td>
      <td>${esc(i.location||"—")}</td>
      <td><span class="qty ${cls}">${fmtN(i.quantity)}</span> <span class="sub">${esc(i.unit)}</span></td>
      <td class="sub">${fmtWhen(i.updated_at)}${i.updated_by?`<br>${esc(i.updated_by.split("@")[0])}`:""}</td>
    </tr>`;}).join("");
  $("rows").querySelectorAll("tr.row").forEach(r=>r.onclick=()=>openItem(r.dataset.id));
}
["q","fCat"].forEach(id=>$(id).addEventListener("input",render));

// ---------- DRAWER ----------
function showDrawer(on){ $("drawer").classList.toggle("hidden",!on); $("shade").classList.toggle("hidden",!on); }
$("dClose").onclick = $("shade").onclick = ()=>showDrawer(false);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") showDrawer(false); });

function setKind(k){
  kind = k;
  $("kinds").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.k===k));
  $("amtLabel").textContent = k==="count" ? "العدد الفعلي على الرف" : k==="in" ? "كام دخل؟" : "كام خرج؟";
}
$("kinds").querySelectorAll("button").forEach(b=>b.onclick=()=>setKind(b.dataset.k));

$("newItem").onclick = ()=>{
  current=null; const f=$("itemForm"); f.reset(); f.unit.value="قطعة"; f.quantity.value="0";
  $("dTitle").textContent="صنف جديد"; $("startQtyF").classList.remove("hidden");
  $("moveBlock").classList.add("hidden"); $("histBlock").classList.add("hidden"); $("delBtn").classList.add("hidden");
  showDrawer(true); f.name.focus();
};

function openItem(id){
  current = items.find(i=>i.id===id); if(!current) return;
  const f=$("itemForm");
  ["name","category","unit","min_qty","location","notes"].forEach(k=>f[k].value = current[k] ?? "");
  $("dTitle").textContent=current.name; $("startQtyF").classList.add("hidden");
  $("nowQty").textContent=fmtN(current.quantity); $("nowUnit").textContent=current.unit+" موجودين دلوقتي";
  $("moveForm").reset(); setKind("count");
  $("moveBlock").classList.remove("hidden"); $("histBlock").classList.remove("hidden"); $("delBtn").classList.remove("hidden");
  showDrawer(true); loadMoves();
}

$("itemForm").addEventListener("submit", async e=>{
  e.preventDefault(); const f=e.target;
  const row = {
    name:f.name.value.trim(), category:f.category.value.trim()||null, unit:f.unit.value.trim()||"قطعة",
    min_qty:f.min_qty.value===""?null:Number(f.min_qty.value), location:f.location.value.trim()||null,
    notes:f.notes.value.trim()||null, updated_by:user.email, updated_at:new Date().toISOString()
  };
  if(!current) row.quantity = Number(f.quantity.value||0);
  $("saveBtn").disabled=true;
  const res = current ? await sb.from("inventory_items").update(row).eq("id",current.id).select().single()
                      : await sb.from("inventory_items").insert(row).select().single();
  $("saveBtn").disabled=false;
  if(res.error){ toast("الحفظ فشل"); console.error(res.error); return; }
  toast(current?"اتعدل ✓":"الصنف اتضاف ✓");
  await loadItems(); openItem(res.data.id);
});

$("moveForm").addEventListener("submit", async e=>{
  e.preventDefault(); if(!current) return; const f=e.target;
  $("moveBtn").disabled=true;
  const { error } = await sb.rpc("inventory_adjust",{ p_item:current.id, p_kind:kind, p_amount:Number(f.amount.value), p_note:f.note.value });
  $("moveBtn").disabled=false;
  if(error){ toast(/not enough/.test(error.message) ? "الكمية اللي خارجة أكبر من الموجود" : "التسجيل فشل"); console.error(error); return; }
  toast(KINDS[kind]+" اتسجل ✓"); const id=current.id; await loadItems(); openItem(id);
});

$("delBtn").onclick = async ()=>{
  if(!current || !confirm(`مسح ${current.name} وكل سجله؟`)) return;
  const { error } = await sb.from("inventory_items").delete().eq("id",current.id);
  if(error){ toast("المسح فشل"); return; }
  showDrawer(false); toast("اتمسح"); loadItems();
};

async function loadMoves(){
  $("timeline").innerHTML = `<li class="meta">بيحمّل…</li>`;
  const { data, error } = await sb.from("inventory_moves").select("*").eq("item_id",current.id).order("created_at",{ascending:false}).limit(50);
  if(error){ $("timeline").innerHTML=""; toast("مشكلة في تحميل السجل"); return; }
  $("timeline").innerHTML = data.length ? data.map(m=>{
    const what = m.kind==="count" ? `جرد: ${fmtN(m.qty_before)} ← ${fmtN(m.qty_after)}`
               : m.kind==="in" ? `وارد +${fmtN(m.amount)} (بقى ${fmtN(m.qty_after)})`
               : `صادر −${fmtN(m.amount)} (بقى ${fmtN(m.qty_after)})`;
    return `<li><div>${what}</div>${m.note?`<div>${esc(m.note)}</div>`:""}
      <div class="meta">${fmtWhen(m.created_at)} · ${esc(m.done_by||"")}</div></li>`;}).join("")
    : `<li class="meta">لسه مفيش حركة</li>`;
}
</script>
</body>
</html>
